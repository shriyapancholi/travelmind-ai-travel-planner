<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>if (!localStorage.getItem("token")) { window.location.replace("login.html"); }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details — TravelMind</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><span>✈</span> TravelMind</div>
            <nav class="sidebar-nav">
                <a class="nav-item" onclick="go('index.html')">🏠 <span>Dashboard</span></a>
                <a class="nav-item" onclick="go('trips.html')">🧳 <span>My Trips</span></a>
                <a class="nav-item" onclick="go('explore.html')">🌍 <span>Explore</span></a>
                <a class="nav-item" id="nav-login">🔐 <span>Login</span></a>
            </nav>
            <div class="sidebar-badge">🇮🇳 Made for India</div>
        </aside>

        <main class="main-content">
            <div class="page-topbar">
                <button class="back-btn" onclick="go('index.html')">← Back to Dashboard</button>
                <div class="topbar-actions">
                    <button class="btn-secondary" onclick="window.print()">🖨 Export / Print</button>
                    <button class="btn-primary" id="saveBtn" onclick="saveCurrentTrip()">💾 Save Trip</button>
                </div>
            </div>

            <div id="save-msg" class="inline-msg" style="display:none; margin-bottom:14px;"></div>

            <div id="tripHero" class="trip-hero"></div>
            <div id="statsBar" class="stats-bar-grid"></div>

            <div class="two-col-layout">
                <div class="col-main">
                    <div id="flights" class="section-card"></div>
                    <div id="return_flights" class="section-card"></div>
                    <div id="packing-section" class="section-card"></div>
                    <div id="itinerary" class="section-card"></div>
                    <div id="trip-notes" class="section-card"></div>
                </div>
                <div class="col-side">
                    <div id="hotels" class="section-card"></div>
                    <div id="budget" class="section-card"></div>
                    <div id="weather" class="section-card"></div>
                    <div id="transport" class="section-card"></div>
                    <div id="tips" class="section-card"></div>
                </div>
            </div>

            <!-- BOTTOM 3-col: emergency, currency, email -->
            <div class="three-col-layout">
                <div id="emergency" class="section-card"></div>
                <div id="currency" class="section-card"></div>
                <div id="email-section" class="section-card"></div>
            </div>

            <!-- RECOMMENDATION: full width -->
            <div id="recommendation" class="section-card"></div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        if (!localStorage.getItem("token")) { window.location.href = "login.html"; }
    </script>
    <script src="weather_widget.js"></script>
    <script src="extras.js"></script>
    <script src="chatwidget.js"></script>
</body>

</html>
