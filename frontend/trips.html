<!DOCTYPE html>
<html>
<head>
    <title>My Trips</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>✈️ TravelMind</h2>
        <ul>
            <li onclick="go('index.html')">🏠 Dashboard</li>
            <li class="active">🧳 My Trips</li>
            <li onclick="go('saved.html')">💾 Saved</li>
            <li onclick="go('explore.html')">🌍 Explore</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">
        <h1>My Trips 🧳</h1>

        <input id="searchTrips" placeholder="🔍 Search destination...">

        <div id="tripsContainer" class="trip-grid"></div>
    </div>

</div>

<script src="script.js"></script>

<script>
let trips = [];

// Load latest trip from localStorage
const latest = JSON.parse(localStorage.getItem("latestTrip"));
if (latest) trips.push(latest);

renderTrips();

function renderTrips() {
    const container = document.getElementById("tripsContainer");

    if (trips.length === 0) {
        container.innerHTML = "😢 No trips found";
        return;
    }

    container.innerHTML = trips.map(trip => `
        <div class="trip-card">
            <img src="https://source.unsplash.com/400x300/?${trip.destination}">
            <h3>${trip.destination}</h3>
            <p>💰 ₹${trip.total_cost} • 📅 ${trip.itinerary?.length || 5} Days</p>

            <div class="actions">
                <button onclick='viewTrip(${JSON.stringify(trip)})'>View</button>
                <button onclick='saveTrip(${JSON.stringify(trip)})'>Save</button>
                <button class="danger" onclick='deleteTrip("${trip.destination}")'>Delete</button>
            </div>
        </div>
    `).join("");
}

function viewTrip(trip) {
    localStorage.setItem("latestTrip", JSON.stringify(trip));
    window.location.href = "details.html";
}

function deleteTrip(destination) {
    trips = trips.filter(t => t.destination !== destination);
    renderTrips();
}

// Search filter
document.getElementById("searchTrips").addEventListener("input", function(e) {
    const value = e.target.value.toLowerCase();
    const filtered = trips.filter(t => t.destination.toLowerCase().includes(value));
    
    document.getElementById("tripsContainer").innerHTML = filtered.map(trip => `
        <div class="trip-card">
            <img src="https://source.unsplash.com/400x300/?${trip.destination}">
            <h3>${trip.destination}</h3>
            <p>💰 ₹${trip.total_cost}</p>
        </div>
    `).join("");
});
</script>

</body>
</html>
