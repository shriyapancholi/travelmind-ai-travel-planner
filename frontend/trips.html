<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>if (!localStorage.getItem("token")) { window.location.replace("login.html"); }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips — TravelMind</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><span>✈</span> TravelMind</div>
            <nav class="sidebar-nav">
                <a class="nav-item" onclick="go('index.html')">🏠 <span>Dashboard</span></a>
                <a class="nav-item active">🧳 <span>My Trips</span></a>
                <a class="nav-item" onclick="go('explore.html')">🌍 <span>Explore</span></a>
                <a class="nav-item" id="nav-login">🔐 <span>Login</span></a>
            </nav>
            <div class="sidebar-badge">🇮🇳 Made for India</div>
        </aside>
        <main class="main-content trips-main">
            <div class="page-header">
                <h1>My Trips 🧳</h1>
                <p>All your generated and saved travel plans — newest first</p>
            </div>
            <input class="search-bar" id="searchTrips" placeholder="🔍 Search by destination, type, or origin city..."
                oninput="filterTrips(this.value)">
            <div id="tripsContainer" class="trips-grid">
                <p class="loading-msg">⏳ Loading your trips...</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        if (!localStorage.getItem("token")) { window.location.href = "login.html"; }
    </script>
    <script src="chatwidget.js"></script>
</body>

</html>
